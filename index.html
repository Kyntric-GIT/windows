<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#dce8f7"><title>Windows 11 Web Edition</title>
<style>
:root{--glass:rgba(248,250,255,.88);--line:rgba(255,255,255,.55);--ink:#20232a;--muted:#626b78;--blue:#1674d1;--shadow:0 18px 55px #10243c38}*{box-sizing:border-box}body{margin:0;font:14px "Segoe UI",Arial,sans-serif;color:var(--ink);overflow:hidden;background:#0b294b}button,input{font:inherit}button{cursor:pointer;border:0;color:inherit}#desktop{position:fixed;inset:0 0 58px;background:linear-gradient(130deg,#dceeff 0%,#9fc8ed 34%,#2c69a5 70%,#102d57 100%);overflow:hidden}#wallpaper{position:absolute;inset:0;background:radial-gradient(ellipse at 68% 43%,#c9e8ff99 0 8%,transparent 35%),radial-gradient(ellipse at 70% 50%,#3a8edb 0 13%,transparent 38%),linear-gradient(135deg,#d9f0ff,#77a9d8 46%,#12345e);filter:saturate(1.08)}#wallpaper:after{content:"";position:absolute;width:55vw;height:55vw;border-radius:50%;right:4%;top:4%;background:radial-gradient(circle at 35% 35%,#ffffff80,transparent 58%);filter:blur(32px)}.desktop-icons{position:relative;z-index:1;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:14px;width:300px;height:100%;}.deskicon{width:82px;min-height:84px;background:transparent;color:white;text-shadow:0 1px 4px #000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1px solid transparent;border-radius:5px}.deskicon:hover,.deskicon:focus{background:#ffffff35;border-color:#ffffff55}.deskicon .emoji{font-size:32px;text-shadow:none}.deskicon span:last-child{font-size:12px;text-align:center}.taskbar{position:fixed;z-index:1000;bottom:0;left:0;right:0;height:58px;background:rgba(245,248,253,.78);backdrop-filter:blur(28px);border-top:1px solid #ffffffa8;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px}.task-left{position:absolute;left:16px;font-size:12px;color:#26364a}.task-center{display:flex;align-items:center;gap:5px}.taskbtn{height:44px;min-width:44px;border-radius:7px;background:transparent;font-size:22px;display:grid;place-items:center;position:relative}.taskbtn:hover,.taskbtn.active{background:#ffffffad}.taskbtn.running:after{content:"";position:absolute;bottom:2px;width:16px;height:3px;border-radius:4px;background:#2779ca}.task-right{position:absolute;right:16px;display:flex;align-items:center;gap:13px;font-size:12px}.tray{border:0;background:transparent;padding:7px;border-radius:6px}.tray:hover{background:#ffffffaa}.panel{position:fixed;z-index:1100;background:var(--glass);backdrop-filter:blur(32px);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;display:none}.panel.show{display:block}.start-panel{bottom:68px;left:50%;transform:translateX(-50%);width:min(620px,calc(100vw - 24px));padding:24px}.searchbox{width:100%;border:1px solid #9ab7d2;border-radius:6px;padding:12px 14px;background:#ffffffd9;outline-color:var(--blue)}.panel-head{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 12px;font-weight:600}.apps-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.app-tile{padding:12px 4px;border-radius:7px;background:transparent;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px}.app-tile:hover{background:#dceafa}.app-tile b{font-size:27px;font-weight:400}.recommended{display:flex;gap:12px;padding:10px;border-radius:7px;align-items:center}.recommended:hover{background:#e4edf8}.power{float:right;background:#e6edf6;border-radius:6px;padding:7px}.window{position:absolute;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);width:min(850px,calc(100vw - 34px));height:min(570px,calc(100vh - 100px));min-width:300px;min-height:230px;background:#f7f9fc;border:1px solid #ffffffd9;border-radius:9px;box-shadow:0 24px 75px #071d3b55;overflow:hidden;display:flex;flex-direction:column}.window.maximized{inset:8px 8px 8px 8px;width:auto;height:auto;transform:none}.titlebar{height:42px;flex:none;display:flex;align-items:center;padding-left:13px;background:#f7f9fc;user-select:none;touch-action:none}.win-title{display:flex;align-items:center;gap:9px;flex:1;font-size:13px}.win-controls{height:100%;display:flex}.win-controls button{width:46px;background:transparent}.win-controls button:hover{background:#e4e8ee}.win-controls .close:hover{background:#d93025;color:white}.window-body{flex:1;overflow:auto;background:#fff}.toolbar{height:48px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid #e4e8ed;background:#f8fafc}.toolbar button,.softbtn{padding:8px 12px;border-radius:5px;background:#eaf1f8}.toolbar button:hover,.softbtn:hover{background:#dce9f7}.content{padding:20px}.hero{padding:24px;border-radius:9px;background:linear-gradient(120deg,#e5f3ff,#f5f8ff);margin-bottom:18px}.hero h2{margin:0 0 8px;font-weight:500}.muted{color:var(--muted)}.filegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.fileitem{padding:15px 8px;border-radius:7px;text-align:center;background:#f7f9fc;display:flex;flex-direction:column;gap:8px;align-items:center}.fileitem:hover{background:#e7f1fb}.fileitem span:first-child{font-size:30px}.settings-row{padding:16px 4px;border-bottom:1px solid #e7ebef;display:flex;justify-content:space-between;align-items:center;gap:20px}.settings-row input[type=color]{width:48px;height:32px;border:0;background:none}.settings-row input[type=checkbox]{width:18px;height:18px}.browserbar{display:flex;gap:7px;padding:10px;background:#f3f6fa}.browserbar input{flex:1;border:1px solid #d0d9e3;border-radius:6px;padding:9px}.browserframe{width:100%;height:calc(100% - 54px);border:0;background:white}.terminal{background:#101820;color:#d8f5dc;font:13px Consolas,monospace;padding:16px;height:100%;overflow:auto}.terminal input{background:transparent;border:0;color:white;outline:0;width:70%}.game-card{padding:14px;border:1px solid #e2e8ef;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0}.game-card button{background:#176fbd;color:white;border-radius:5px;padding:8px 14px}.notification{position:fixed;z-index:1300;right:18px;bottom:75px;background:#fff;padding:14px 18px;border-radius:9px;box-shadow:var(--shadow);display:none}.notification.show{display:block}@media(max-width:600px){.task-left{display:none}.apps-grid{grid-template-columns:repeat(4,1fr)}.start-panel{padding:16px}.task-right{right:7px}.window{width:calc(100vw - 12px);height:calc(100vh - 82px)}}
</style></head>
<body><main id="desktop"><div id="wallpaper"></div><div class="desktop-icons">
<button class="deskicon" data-app="explorer"><span class="emoji">📁</span><span>This PC</span></button>
<button class="deskicon" data-app="browser"><span class="emoji">🌐</span><span>Browser</span></button>
<button class="deskicon" data-app="store"><span class="emoji">🛍️</span><span>Game Library</span></button>
<button class="deskicon" data-app="settings"><span class="emoji">⚙️</span><span>Settings</span></button>
<button class="deskicon" data-app="terminal"><span class="emoji">⌨️</span><span>Terminal</span></button>
</div></main>
<div class="panel start-panel" id="startPanel"><input id="startSearch" class="searchbox" placeholder="🔎  Search for apps, settings, and documents"><div class="panel-head"><span>Pinned</span><span class="muted">All apps ›</span></div><div class="apps-grid" id="startApps"></div><div class="panel-head"><span>Recommended</span><span class="muted">More ›</span></div><div class="recommended">📁 <div><b>File Explorer</b><div class="muted">Browse your files</div></div></div><div class="panel-head"><span>Web Edition</span><button class="power" id="powerBtn">⏻</button></div></div>
<div class="panel" id="quickPanel" style="right:14px;bottom:68px;width:300px;padding:18px"><div class="apps-grid" style="grid-template-columns:repeat(3,1fr)"><button class="app-tile" id="wifiBtn"><b>📶</b>Wi-Fi</button><button class="app-tile"><b>🔵</b>Bluetooth</button><button class="app-tile"><b>🌙</b>Focus</button></div><hr style="border:0;border-top:1px solid #ddd"><div class="muted">Quick settings · Web Edition</div></div>
<div class="taskbar"><div class="task-left">☁  Web Edition</div><div class="task-center"><button class="taskbtn" id="startBtn" title="Start">⊞</button><button class="taskbtn" data-app="search" title="Search">🔎</button><button class="taskbtn" data-app="explorer" title="File Explorer">📁</button><button class="taskbtn" data-app="browser" title="Browser">🌐</button><button class="taskbtn" data-app="store" title="Game Library">🎮</button><button class="taskbtn" data-app="settings" title="Settings">⚙️</button><span id="runningTasks"></span></div><div class="task-right"><button class="tray" id="quickBtn">⌃　◉　🔊</button><span id="clock"></span></div></div>
<div class="notification" id="toast"></div>
<script>
const apps=[["explorer","📁","File Explorer"],["browser","🌐","Browser"],["store","🎮","Game Library"],["settings","⚙️","Settings"],["terminal","⌨️","Terminal"],["notepad","📝","Notepad"],["about","💠","About"]];
const wins=new Map();let z=20;const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){const n=$("#toast");n.textContent=t;n.classList.add("show");setTimeout(()=>n.classList.remove("show"),2600)}
function openApp(id){if(id==="search"){ $("#startPanel").classList.add("show");$("#startSearch").focus();return}if(wins.has(id)){const w=wins.get(id);w.style.display="flex";w.style.zIndex=++z;return}
const app=apps.find(a=>a[0]===id);if(!app)return;const w=document.createElement("section");w.className="window";w.dataset.app=id;w.style.resize='both';w.style.zIndex=++z;w.innerHTML='<div class="titlebar"><div class="win-title"><span>'+app[1]+'</span><span>'+app[2]+'</span></div><div class="win-controls"><button data-act="min">—</button><button data-act="max">□</button><button class="close" data-act="close">×</button></div></div><div class="window-body">'+renderApp(id)+'</div>';$("#desktop").append(w);if(id==="notepad")$("#noteText").value=localStorage.getItem("web-note")||"";wins.set(id,w);w.addEventListener("mousedown",()=>w.style.zIndex=++z);w.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{const a=b.dataset.act;if(a==="close"){w.remove();wins.delete(id);updateRunning()}if(a==="min")w.style.display="none";if(a==="max")w.classList.toggle("maximized")});drag(w);w.addEventListener("click",handleAppClick);w.addEventListener("submit",handleSubmit);updateRunning();$("#startPanel").classList.remove("show")}
function renderApp(id){if(id==="explorer")return '<div class="toolbar"><button>←</button><button>→</button><button>↑</button><span style="flex:1;background:#fff;border:1px solid #ddd;border-radius:5px;padding:7px">This PC</span><button>⋯</button></div><div class="content"><h2>Quick access</h2><div class="filegrid"><button class="fileitem"> <span>🖥️</span>This PC</button><button class="fileitem"><span>📂</span>Documents</button><button class="fileitem"><span>🖼️</span>Pictures</button><button class="fileitem"><span>🎮</span>Games</button><button class="fileitem"><span>⬇️</span>Downloads</button><button class="fileitem"><span>☁️</span>Cloud</button></div><p class="muted" style="margin-top:24px">This is your Web Edition workspace. Browser storage is used for local settings and game shortcuts.</p></div>';
if(id==="browser")return '<div class="browserbar"><button data-browser="home" title="Home">⌂</button><input id="browserUrl" value="" placeholder="Search Bing or enter a website address"><button data-browser="go">Search / Go ↗</button></div><div class="window-body" style="display:grid;place-items:center;text-align:center;padding:24px"><div style="max-width:460px"><div style="font-size:54px">🌐</div><h2 style="font-weight:500">Web Browser</h2><p class="muted">Search with Bing or enter a website address above. Some websites block being displayed inside other apps, so they open in a new browser tab.</p><button class="softbtn" data-browser="bing">Open Bing ↗</button></div></div>';
if(id==="store")return '<div class="content"><div class="hero"><h2>🎮 Your Game Library</h2><p>Import games from your GitHub projects and launch web-playable builds here.</p><button class="softbtn" data-action="import">＋ Import from GitHub</button></div><div id="gamesList"></div><p class="muted">Tip: the most reliable import is a game already published with GitHub Pages. You can also enter a direct web game URL.</p></div>';
if(id==="settings")return '<div class="content"><h2>Settings</h2><p class="muted">Personalize your Web Edition desktop.</p><div class="settings-row"><div><b>Accent color</b><div class="muted">Change the interface accent</div></div><input type="color" id="accent" value="#1674d1"></div><div class="settings-row"><div><b>Wallpaper</b><div class="muted">Choose a desktop background</div></div><select id="wallSelect"><option value="blue">Windows blue</option><option value="purple">Purple glow</option><option value="dark">Midnight</option></select></div><div class="settings-row"><div><b>Show desktop clock</b><div class="muted">Taskbar date and time</div></div><input type="checkbox" id="clockToggle" checked></div><div class="settings-row"><div><b>About</b><div class="muted">Windows 11 Web Edition · Browser simulation</div></div><span>ⓘ</span></div></div>';
if(id==="terminal")return '<div class="terminal" id="term"><div>Windows 11 Web Edition [Version 1.0]<br>(c) Kyntric-GIT. All rights reserved.<br><br>Type "help" to see available commands.<br><br><span id="termOut"></span><form id="termForm"><span>webuser&gt; </span><input id="termInput" autocomplete="off" autofocus></form></div></div>';
if(id==="notepad")return '<div class="toolbar"><button data-action="save-note">Save locally</button><span class="muted">Notepad</span></div><textarea id="noteText" style="width:100%;height:calc(100% - 48px);border:0;resize:none;padding:18px;outline:0;font:15px Consolas" placeholder="Start typing..."></textarea>';
return '<div class="content"><div class="hero"><h2>Windows 11 Web Edition</h2><p>A Windows-inspired desktop experience, running entirely in your browser.</p></div><p>Built for Kyntric-GIT.</p><p class="muted">This is not a licensed Microsoft Windows operating system and does not run native Windows applications.</p></div>'}
function drag(w){const bar=w.querySelector(".titlebar");let sx,sy,ox,oy;bar.addEventListener("pointerdown",e=>{if(e.target.closest(".win-controls")||w.classList.contains("maximized"))return;sx=e.clientX;sy=e.clientY;const r=w.getBoundingClientRect();ox=r.left;oy=r.top;bar.setPointerCapture(e.pointerId);const move=e=>{w.style.left=ox+e.clientX-sx+"px";w.style.top=oy+e.clientY-sy+"px";w.style.transform="none"};const up=()=>{bar.removeEventListener("pointermove",move);bar.removeEventListener("pointerup",up)};bar.addEventListener("pointermove",move);bar.addEventListener("pointerup",up)})}
function updateRunning(){$("#runningTasks").innerHTML=[...wins.keys()].map(id=>'<button class="taskbtn running" data-task="'+id+'">'+apps.find(a=>a[0]===id)[1]+'</button>').join("");$("#runningTasks").querySelectorAll("button").forEach(b=>b.onclick=()=>openApp(b.dataset.task))}
function handleAppClick(e){const b=e.target.closest("[data-action],[data-browser]");if(!b)return;const act=b.dataset.action;if(act==="import")importGame();if(act==="save-note"){localStorage.setItem("web-note",$("#noteText").value);toast("Note saved in this browser")}if(b.dataset.browser){const inp=b.closest(".window")?.querySelector("#browserUrl");const mode=b.dataset.browser;if(mode==="home"){if(inp)inp.value="";toast("Enter a search or website address above")}if(mode==="bing"){window.open("https://www.bing.com","_blank","noopener,noreferrer")}if(mode==="go"){let q=(inp?.value||"").trim();let url;if(!q)url="https://www.bing.com";else if(/^https?:\\/\\//i.test(q))url=q;else if(/^([\\w-]+\\.)+[a-z]{2,}([/:?#].*)?$/i.test(q))url="https://"+q;else url="https://www.bing.com/search?q="+encodeURIComponent(q);window.open(url,"_blank","noopener,noreferrer")}}}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="browserUrl"){e.preventDefault();e.target.closest(".window")?.querySelector('[data-browser="go"]')?.click()}});
function handleSubmit(e){if(e.target.id==="termForm"){e.preventDefault();const inp=$("#termInput"),out=$("#termOut"),cmd=inp.value.trim();let result="";if(cmd==="help")result="help  - show commands\\nclear - clear screen\\n date - show current date\\napps  - list applications\\nabout - system information";else if(cmd==="clear")out.innerHTML="";else if(cmd==="date")result=new Date().toString();else if(cmd==="apps")result=apps.map(a=>a[2]).join("\\n");else if(cmd==="about")result="Windows 11 Web Edition · Kyntric-GIT";else result="Command not found: "+cmd;out.innerHTML+=esc("webuser> "+cmd+"\\n"+result+"\\n");inp.value=""}}
function importGame(){const repo=prompt("Paste your GitHub repository URL or the published game URL:");if(!repo)return;let url=repo.trim();const m=url.match(/^https?:\/\/github\.com\/([^/]+)\/([^/#?]+)/i);if(m){const owner=m[1],name=m[2].replace(/\.git$/,"");url="https://"+owner+".github.io/"+name+"/";}if(!/^https?:\/\//i.test(url)){toast("Please enter a valid web URL");return}const title=prompt("Name this game:",repo.split("/").filter(Boolean).pop()||"My game")||"My game";const games=JSON.parse(localStorage.getItem("web-games")||"[]");games.push({title,url});localStorage.setItem("web-games",JSON.stringify(games));renderGames();toast("Game added to your library")}
function renderGames(){const box=$("#gamesList");if(!box)return;const games=JSON.parse(localStorage.getItem("web-games")||"[]");box.innerHTML=games.length?games.map((g,i)=>'<div class="game-card"><div><b>🎮 '+esc(g.title)+'</b><div class="muted">'+esc(g.url)+'</div></div><div><button data-play="'+i+'">Play</button> <button data-remove="'+i+'" style="background:#e7edf4;color:#333">×</button></div></div>').join(""):'<p class="muted">No games imported yet. Choose Import from GitHub to add your first game.</p>';box.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>{const g=games[+b.dataset.play];const id="game"+Date.now();const w=document.createElement("section");w.className="window";w.style.zIndex=++z;w.innerHTML='<div class="titlebar"><div class="win-title">🎮 '+esc(g.title)+'</div><div class="win-controls"><button data-close>×</button></div></div><div class="window-body"><iframe src="'+esc(g.url)+'" style="width:100%;height:100%;border:0" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe></div>';$("#desktop").append(w);w.querySelector("[data-close]").onclick=()=>w.remove();drag(w)});box.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{games.splice(+b.dataset.remove,1);localStorage.setItem("web-games",JSON.stringify(games));renderGames()})}
document.addEventListener("input",e=>{if(e.target.id==="accent")document.documentElement.style.setProperty("--blue",e.target.value)});document.addEventListener("change",e=>{if(e.target.id==="wallSelect"){const v=e.target.value;$("#wallpaper").style.background=v==="purple"?"radial-gradient(circle at 70% 45%,#d7a7ff,#6349a0 48%,#20183d)":v==="dark"?"linear-gradient(135deg,#101827,#253b58)":"radial-gradient(ellipse at 68% 43%,#c9e8ff99 0 8%,transparent 35%),linear-gradient(135deg,#d9f0ff,#77a9d8 46%,#12345e)"}if(e.target.id==="clockToggle")$("#clock").style.display=e.target.checked?"":"none"});function init(){apps.forEach(a=>{$("#startApps").innerHTML+='<button class="app-tile" data-open="'+a[0]+'"><b>'+a[1]+'</b>'+a[2]+'</button>'});document.querySelectorAll("[data-app]").forEach(b=>b.addEventListener("click",()=>openApp(b.dataset.app)));$("#startBtn").onclick=()=>$("#startPanel").classList.toggle("show");$("#quickBtn").onclick=()=>$("#quickPanel").classList.toggle("show");$("#startApps").onclick=e=>{const b=e.target.closest("[data-open]");if(b)openApp(b.dataset.open)};$("#startSearch").oninput=e=>{const q=e.target.value.toLowerCase();$("#startApps").querySelectorAll("button").forEach(b=>b.style.display=b.textContent.toLowerCase().includes(q)?"flex":"none")};$("#powerBtn").onclick=()=>toast("This is a browser desktop. Close the tab to exit.");$("#accent").oninput=e=>document.documentElement.style.setProperty("--blue",e.target.value);$("#wallSelect").onchange=e=>{const w=$("#wallpaper");w.style.background=e.target.value==="purple"?"radial-gradient(circle at 70% 45%,#d7a7ff,#6349a0 48%,#20183d)":e.target.value==="dark"?"linear-gradient(135deg,#101827,#253b58)":"radial-gradient(ellipse at 68% 43%,#c9e8ff99 0 8%,transparent 35%),linear-gradient(135deg,#d9f0ff,#77a9d8 46%,#12345e)"};$("#clockToggle").onchange=e=>$("#clock").style.display=e.target.checked?"":"none";$("#noteText")?.addEventListener("focus",()=>{});setInterval(()=>{$("#clock").innerHTML=new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+"<br>"+new Date().toLocaleDateString([],{month:"numeric",day:"numeric",year:"numeric"})},1000);document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#startPanel").classList.remove("show");$("#quickPanel").classList.remove("show")}if(e.key==="Meta"||e.key==="OS")$("#startPanel").classList.toggle("show")});renderGames()}
init();
</script></body></html>
